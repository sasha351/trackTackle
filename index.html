<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Every icon is flattened onto --bg rather than left transparent: the
         mark's cream highlights disappear against a light browser tab. This
         one is additionally cropped to the artwork's bounding box — icon.png
         carries ~12% dead margin per side, which is the difference between a
         readable tackle box and a teal smudge once a tab shrinks it to 16px. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Matches the --bg token in index.css, so the phone's status bar and the
         install splash screen don't flash white against a dark app. -->
    <meta name="theme-color" content="#0f1417" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Tackle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
